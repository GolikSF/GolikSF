<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Days for Yaara 🇩🇪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>
<div class="floaters" id="floaters"></div>

<main>
  <header class="hero">
    <p class="eyebrow">⏳ counting down for</p>
    <h2 class="name">YAARA</h2>

    <h1 class="countdown">
      <span id="dayCount">100</span>
      <span class="daycount-label" id="dayWord">DAYS!!!!!!</span>
    </h1>

    <p class="subtitle">🇩🇪 Another <span id="germanCount">100</span> Germans to finger</p>
  </header>

  <section class="grid-wrap">
    <div class="grid" id="grid" aria-label="100 day countdown grid, one tile per day"></div>
  </section>

  <footer class="outro">
    <p class="tagline">Until I will be gold digger <span class="shovel">⛏️</span></p>
    <p class="target-date" id="targetDate"></p>
  </footer>
</main>

<div class="confetti-layer" id="confetti"></div>

<script src="script.js"></script>
</body>
</html>
