<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin | Guy's web</title>
  <meta name="description" content="A live-updating Bitcoin price chart, built with the Canvas API." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M16 7 L8 24 L24 24 Z' stroke='%23E8B84B' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='16' cy='7' r='2.6' fill='%23E8B84B'/%3E%3Ccircle cx='8' cy='24' r='2.6' fill='%23E8B84B'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%23E8B84B'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--accent-2)" />
        <stop offset="100%" stop-color="var(--accent)" />
      </linearGradient>
      <symbol id="logoMark" viewBox="0 0 32 32">
        <path d="M16 7 L8 24 L24 24 Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <circle cx="16" cy="7" r="2.6" fill="currentColor" />
        <circle cx="8" cy="24" r="2.6" fill="currentColor" />
        <circle cx="24" cy="24" r="2.6" fill="currentColor" />
      </symbol>
    </defs>
  </svg>

  <nav class="nav" id="nav">
    <a href="index.html" class="wordmark">
      <span class="monogram" aria-hidden="true"><svg class="monogram-icon"><use href="#logoMark"></use></svg></span>
      Guy's web
    </a>

    <div class="nav-links">
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="bitcoin.html" class="active">Bitcoin</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      <button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <button class="icon-btn close-btn" id="menuClose" aria-label="Close menu">✕</button>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="bitcoin.html" class="active">Bitcoin</a>
    <a href="contact.html">Contact</a>
  </div>

  <header class="page-hero">
    <div class="page-hero-glow" aria-hidden="true"></div>
    <div class="page-hero-inner">
      <p class="eyebrow center">Markets</p>
      <h1 class="page-title">Bitcoin, live</h1>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="wrap-narrow">
        <div class="market-card">
          <div class="market-top">
            <span class="market-name">Bitcoin <span class="market-ticker">BTC</span></span>
            <span class="status-pill" id="liveBadge">
              <span class="status-dot" id="liveDot"></span>
              <span id="liveLabel">Connecting</span>
            </span>
          </div>

          <div class="market-price" id="btcPrice">—</div>

          <div class="market-change" id="btcChange">
            <span id="btcArrow"></span>
            <span id="btcChangeValue">—</span>
            <span class="market-change-label">today</span>
          </div>

          <div class="market-chart">
            <canvas id="btcChart" role="img" aria-label="Bitcoin price chart, live"></canvas>
          </div>

          <p class="market-updated" id="btcUpdated" aria-live="polite">Connecting to market feed…</p>
        </div>

        <div class="page-nav">
          <a href="skills.html">← Skills</a>
          <a href="contact.html" class="next">Contact →</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <a href="index.html" class="wordmark">
        <span class="monogram" aria-hidden="true"><svg class="monogram-icon"><use href="#logoMark"></use></svg></span>
        Guy's web
      </a>
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="bitcoin.html" class="active">Bitcoin</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <p class="fine-print center">© <span class="year"></span> Guy's web</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
